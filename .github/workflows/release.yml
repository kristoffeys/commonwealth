name: Release

# Publish the @cmnwlth/* packages to npm (#49) and create the GitHub Release (#159). Two ways in:
#  - push a `v*` tag (e.g. `v0.1.0`) → publishes the current versions, or
#  - run this workflow manually (workflow_dispatch).
# Versions are managed with Changesets: `pnpm changeset` to record a change, `pnpm
# changeset version` to bump, commit, then tag. `changeset publish` only publishes packages
# whose version isn't already on the registry, so re-runs are safe.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN (#261). The `id-token: write`
# permission below lets npm mint a short-lived, workflow-scoped credential from GitHub's OIDC
# provider, so there is no long-lived token to expire, leak, or trip npm's 2FA restrictions.
#
# Prerequisites (one-time, owner):
#  - On npmjs.com, for EACH `@cmnwlth/*` package: Settings → Trusted Publisher → GitHub Actions,
#    repo `kristoffeys/commonwealth`, workflow `release.yml`. A package missing its trusted
#    publisher 404s on publish (npm masks the permission error as 404 for scoped packages).
#  - The repo must be PUBLIC and npm on the runner must be >= 11.5.1 (the `npm i -g npm@latest`
#    step below guarantees it). Trusted publishing turns on provenance automatically.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the tag
      id-token: write # npm provenance / OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24's bundled npm can lag that.
      # `changeset publish` shells out to this global npm, so upgrade it before publishing.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Gate the release on a green build + tests before anything reaches the registry.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Both agent manifests, hook assets, and published runtime pins must move together.
      - run: node scripts/release.mjs verify
      # `changeset publish` publishes each @cmnwlth/* package (workspace:* deps rewritten to real
      # versions) and skips already-published versions. Auth is OIDC trusted publishing — no
      # NODE_AUTH_TOKEN; npm exchanges the id-token for a short-lived publish credential and
      # attaches provenance automatically.
      - run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # The everyday release path is a locally pushed tag (scripts/release.mjs --commit +
      # `git push --follow-tags`), which lands here — so the GitHub Release is created here
      # too (#159), with generated notes, AFTER the npm publish succeeded. Idempotent: a
      # release that already exists (a re-run, or the Version & Release workflow's own step)
      # is left alone. Skipped on a workflow_dispatch from a branch — no tag, no release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
